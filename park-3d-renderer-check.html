<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><title>Park 3D Fixed Camera Renderer Check</title>
<style>html,body{margin:0;background:#070e1d;color:#ddfbfb;font-family:system-ui;height:100%}.title{padding:12px 20px;font-size:22px}.stage{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;height:calc(100% - 70px);padding:12px;box-sizing:border-box}.camera{border:3px solid #9b7a44;border-radius:12px;overflow:hidden;position:relative}.camera canvas{width:100%;height:100%;display:block}.stamp{position:absolute;top:10px;left:10px;background:#06111cda;border:1px solid #67bfc2;border-radius:6px;padding:8px}.previews{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr);gap:10px;min-height:0}.small{border:2px solid #637a9b;border-radius:8px;overflow:hidden;position:relative}.small canvas{width:100%;height:100%;display:block}.small div{position:absolute;bottom:3px;left:6px;background:#07121edc;padding:2px 4px;font-size:11px}</style>
</head><body><div class="title">Mayfield Park · True 3D rooms · one fixed camera per zone</div>
<div class="stage"><div class="camera"><canvas id="main"></canvas><div class="stamp" id="state">S1 — SHELTER · FIXED 3D CAMERA</div></div><div class="previews" id="previews"></div></div>
<script type="module">
import {Park3DRenderer,PARK_3D_ZONES} from './src/park-3d-scene.js';
const humans=[{id:'ranger',name:'Ranger',room:'S1',x:31,kind:'human',color:'#52cb9a',role:'park ranger',activityState:'en_route'},{id:'photo-mom',name:'Maya',room:'S1',x:70,kind:'human',color:'#d89be1',role:'photographer',activityState:'working'},{id:'park-cat',name:'Whiskers',room:'S1',x:80,kind:'animal',color:'#ebc589',role:'cat'}];
const room=document.getElementById('main');
try{
const renderer=new Park3DRenderer(room);
function draw(t){const r=room.getBoundingClientRect();renderer.render({zoneId:'S1',actors:humans,lightsOn:true,trapActive:true,time:t/1000,width:r.width,height:r.height});requestAnimationFrame(draw);}
requestAnimationFrame(draw);
for(const zoneId of PARK_3D_ZONES){
 const box=document.createElement('div');box.className='small';const canvas=document.createElement('canvas');box.append(canvas);
 const label=document.createElement('div');label.innerText=zoneId+' · Perspective 3D';box.append(label);
 document.getElementById('previews').append(box);const renderer2=new Park3DRenderer(canvas);
 const r=canvas.getBoundingClientRect();renderer2.render({zoneId,actors:[{...humans[0],room:zoneId,x:49}],lightsOn:true,time:1,width:r.width,height:r.height});
}
window.renderOk=true;document.getElementById('state').innerText='S1 · SHELTER · FIXED CAMERA · WEBGL OK';
} catch (e) {window.renderError=e.message;document.getElementById('state').innerText='WEBGL FAILED: '+e.message;}
</script></body></html>
